<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>👉🎁 Prizes Graph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* חוסם לחלוטין כל אפשרות לגלילה */
      background-color: #fcfcfc;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* נותנים ל-iframe גודל יחסי רחב ומכווצים אותו כך שיישב בול בתוך המסך */
    iframe {
      width: 130%;
      height: 130%;
      border: none;
      transform: scale(0.75); /* כיווץ עדין שמתאים למסכי מחשב רגילים */
      transform-origin: center center;
    }
  </style>
</head>
<body>
  <div class="container">
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQY7k7L9-G25mlG_gPKpzMzGfGrdX-RZkRvzzPee594neieFhvUb1qhCVG2DtIhGC5JQIyW8OLkWVid/pubchart?oid=692775488&format=interactive"></iframe>
  </div>
</body>
</html>
