  <style>

      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fcfcfc;
    }

      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ה-iframe יתאים את עצמו למסך בצורה חלקה */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
