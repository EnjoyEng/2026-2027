<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>👉🎁 Prizes Graph</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fcfcfc;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* הגדרות למחשב */
    iframe {
      width: 75%;
      height: 75%;
      border: none;
      transform: scale(0.75);
      transform-origin: top left; /* מכווץ מהפינה השמאלית עליונה */
    }

    /* הגדרות מיוחדות לטלפונים ניידים (מסכים קטנים מ-600 פיקסלים) */
    @media only screen and (max-width: 600px) {
      iframe {
        width: 200%;
        height: 150%;
        transform: scale(1); /* כיווץ שמותאם למסך אנכי של טלפון */
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQY7k7L9-G25mlG_gPKpzMzGfGrdX-RZkRvzzPee594neieFhvUb1qhCVG2DtIhGC5JQIyW8OLkWVid/pubchart?oid=692775488&format=interactive"></iframe>
  </div>
</body>
</html>
